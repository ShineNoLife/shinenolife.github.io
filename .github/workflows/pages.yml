name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_site' \
            --exclude='./scripts' \
            --exclude='./README.md' \
            --exclude='./.gitignore' \
            -cf - . | tar -xf - -C _site
          touch _site/.nojekyll

      - name: Add GA4 analytics config
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: |
          if [ -z "$GA4_MEASUREMENT_ID" ]; then
            echo "Missing GA4_MEASUREMENT_ID repository secret."
            exit 1
          fi

          mkdir -p _site/analytics

          node <<'NODE'
          const fs = require("fs");
          const measurementId = process.env.GA4_MEASUREMENT_ID.trim();

          if (!/^G-[A-Z0-9]+$/i.test(measurementId)) {
            throw new Error("GA4_MEASUREMENT_ID must look like G-XXXXXXXXXX.");
          }

          const config = {
            googleAnalytics: {
              enabled: true,
              measurementId,
              productionHosts: ["shinenolife.github.io"],
              trackLocalhost: false
            }
          };

          fs.writeFileSync(
            "_site/analytics/config.js",
            `export const analyticsConfig = ${JSON.stringify(config, null, 2)};\n`
          );
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
